[package]
name = "sbwt"
version = "0.6.0"
edition = "2021"
rust-version = "1.77" # 1.77 needed for File::create_new
license = "MIT"
description = "Indexing sets of DNA k-mers with the spectral Burrow-Wheeler transform."
repository = "https://github.com/jnalanko/sbwt-rs-cli/tree/master/api"
authors = ["Jarno Niklas Alanko <alanko.jarno@gmail.com>", "Martin Kostadinov", "Lore Depuydt"]

# docs.rs builds with default features only, which would leave the libsais-gated
# BuildByLibsais out of the documentation. Locally the equivalent is
# `cargo doc -p sbwt --all-features`.
[package.metadata.docs.rs]
all-features = true

[dependencies]
rayon = "1"
num = "0.4"
simple-sds-sbwt = "0.3.4"
clap = "4.4"
jseqio = "0.1.7"
unitig_flipper = "0.1.0" 
env_logger = "0.10"
log = "0.4"
crossbeam = "0.5"
read_exact = "0.0.1"
bitvec = "1.0.1"
rand = "0.7"
test-log = "0.2"
byteorder = "1.5"
chrono = "0.4"
embed-doc-image = "0.1.4"
serde = {version = "1.0", features = ["derive"]}
human_bytes = "0.4"
bytemuck = {version = "1.23.0"}
wide = { version = "1.5.0" }
ahash = { version = "=0.8.12" }
dashmap = { version = "6.2.1" }
libsais = { version = "0.2.0", optional = true }

[dev-dependencies]
rand_chacha = "0.3.1" # Seeded rng in tests
hex-literal = "0.4.1" # Hex literals in tests
